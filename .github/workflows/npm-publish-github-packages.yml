# This workflow will build a Firefox XPI package when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build-firefox-xpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create XPI package
        run: |
          # Create XPI file from extension files
          zip -r Ask-Duck.ai-${{ github.event.release.tag_name }}.xpi . \
            -x "node_modules/*" \
            ".git/*" \
            ".github/*" \
            "docs/*" \
            ".gitignore" \
            "package.json" \
            "package-lock.json" \
            ".DS_Store" \
            "README.md" \
            "LICENSE" \
            "PRIVACY.md" \
            "CHANGELOG.md"
      
      - name: Upload XPI to release
        uses: softprops/action-gh-release@v2
        with:
          files: Ask-Duck.ai-${{ github.event.release.tag_name }}.xpi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://npm.pkg.github.com/
      
      - name: Install dependencies
        run: npm install
      
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
