name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  build-firefox-xpi:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build extension
        run: npm run build || echo "No build script found, proceeding with zip"
      
      - name: Create XPI package
        run: |
          if [ -d "dist" ]; then
            cd dist
            zip -r ../Ask-Duck.ai-${{ github.event.release.tag_name }}.xpi .
            cd ..
          else
            zip -r Ask-Duck.ai-${{ github.event.release.tag_name }}.xpi . \
              -x "node_modules/*" ".git/*" ".github/*" "docs/*" ".gitignore" "package.json" "package-lock.json"
          fi
      
      - name: Upload XPI to release
        uses: softprops/action-gh-release@v1
        with:
          files: Ask-Duck.ai-${{ github.event.release.tag_name }}.xpi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
